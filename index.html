function complexityScore(c){let score=0;c.p.forEach(v=>{if(v<0){score+=Math.abs(v)>=1?2:3;return}if(v<=1/12+1e-9)score+=8;else if(v<=.125+1e-9)score+=7;else if(v<=1/6+1e-9)score+=6;else if(v<=.25+1e-9)score+=4;else if(v<=1/3+1e-9)score+=3;else if(v<1)score+=2});let pulses=c.p.reduce((a,b)=>a+Math.abs(b),0);return score+pulses*3+(c.m==='x'?8:0)}

function playRhythmExercise(){let cell=questionCell,bpm=questionBpm;if(!cell)return;document.getElementById('listenBtn').style.display='none';document.getElementById('relistenBtn').style.display='none';document.getElementById('restartBtn').style.display='none';stopAllAudio();let token=++playToken,c=ac(),beat=60/bpm,t=c.currentTime+.12,total=cell.p.reduce((a,b)=>a+Math.abs(b),0),ci=document.querySelector('#countin'),tm=document.querySelector('#tempoMark');tm.textContent=tempoName(bpm)+' · ♩ = '+bpm;tm.style.visibility='visible';ci.textContent='4';for(let i=0;i<4;i++){hit(430,t+i*beat,.035);setTimeout(()=>{if(token===playToken)ci.textContent=String(4-i)},i*beat*1000)}setTimeout(()=>{if(token===playToken){ci.textContent='';tm.style.visibility='hidden'}},4*beat*1000);let at=t+4*beat;cell.p.forEach(v=>{let d=Math.abs(v);if(v>0)hit(820,at,Math.min(.05,d*beat*.5));at+=d*beat});setTimeout(()=>{if(token===playToken&&document.getElementById('gameScreen').style.display!=='none'){document.getElementById('relistenBtn').style.display='inline-block';document.getElementById('rchoices').style.visibility='visible';armHint()}},Math.max(0,(at-c.currentTime)*1000)+150)}
